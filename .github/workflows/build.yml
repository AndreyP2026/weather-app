name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip build-essential git python3 python3-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev zlib1g-dev autoconf libtool pkg-config libffi-dev \
          unzip wget cmake ninja-build patch
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel packaging
        python -m pip install cython==0.29.33 buildozer
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Погода Приморья
        package.name = pogodaprimorye
        package.domain = org.weather
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,txt
        version = 1.0.0
        
        # Без жесткой версии python3, чтобы p4a корректно применил все Android-патчи
        requirements = python3,kivy==2.2.1,requests
        
        android.permissions = INTERNET,ACCESS_NETWORK_STATE
        android.api = 33
        android.minapi = 21
        
        # NDK 25b - золотой стандарт для этой связки
        android.ndk = 25b
        android.accept_sdk_license = True
        
        orientation = portrait
        fullscreen = 0
        log_level = 2
        
        # ИСПРАВЛЕНИЕ: Используем РЕАЛЬНЫЙ существующий стабильный тег релиза.
        # В этой версии НЕТ сломанного рецепта libthorvg, который вызывает IndexError.
        p4a.branch = 2023.07.20
        EOF
    
    - name: Build APK
      run: |
        echo "КРИТИЧЕСКИ ВАЖНО: Полная очистка кэша для удаления всех следов предыдущих сборок..."
        rm -rf ~/.buildozer
        rm -rf .buildozer
        
        buildozer -v android debug 2>&1 | tee build_output.log || true
        
        if grep -q "Buildozer failed to execute" build_output.log; then
          echo "Сборка завершилась с ошибкой. Лог сохранен."
          exit 1
        fi
    
    - name: Upload APK artifact (если успешно)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: weather-app-apk
        path: bin/*.apk
        retention-days: 7

    - name: Upload Full Error Log (если упало)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-full-error-log
        path: build_output.log
        retention-days: 7
