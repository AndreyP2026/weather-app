name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip build-essential git python3 python3-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev zlib1g-dev autoconf libtool pkg-config libffi-dev \
          unzip wget cmake ninja-build patch
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel packaging
        python -m pip install cython==0.29.33 buildozer
    
    - name: Pre-clone and patch python-for-android
      run: |
        echo "Клонирование python-for-android и применение критических патчей..."
        mkdir -p /home/runner/work/weather-app/weather-app/.buildozer/android/platform
        cd /home/runner/work/weather-app/weather-app/.buildozer/android/platform
        git clone -b master --single-branch https://github.com/kivy/python-for-android.git
        
        # ПАТЧ 1: Отключаем сломанный рецепт libthorvg
        RECIPE_FILE="python-for-android/pythonforandroid/recipes/libthorvg/__init__.py"
        if [ -f "$RECIPE_FILE" ]; then
            echo "Применение патча к libthorvg..."
            sed -i 's/    def build_arch(self, arch):/    def build_arch(self, arch):\n        pass  # PATCHED: libthorvg not needed for Kivy 2.2.1\n    def _disabled_build_arch(self, arch):/' "$RECIPE_FILE"
        fi
        
        # ПАТЧ 2: Фиксируем версию Python на 3.11.9 в рецепте python3
        PYTHON_RECIPE="python-for-android/pythonforandroid/recipes/python3/__init__.py"
        if [ -f "$PYTHON_RECIPE" ]; then
            echo "Применение патча к python3 рецепту..."
            # Находим строку с version и заменяем на 3.11.9
            sed -i "s/version = .*/version = '3.11.9'/" "$PYTHON_RECIPE"
            # Также патчим url, если он использует переменную version
            sed -i "s|'https://www.python.org/ftp/python/' + self.version|'https://www.python.org/ftp/python/3.11.9'|" "$PYTHON_RECIPE"
            echo "Патч python3 применен."
        fi

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Погода Приморья
        package.name = pogodaprimorye
        package.domain = org.weather
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,txt
        version = 1.0.0
        
        requirements = python3,kivy==2.2.1,requests
        
        android.permissions = INTERNET,ACCESS_NETWORK_STATE
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True
        
        orientation = portrait
        fullscreen = 0
        log_level = 2
        p4a.branch = master
        EOF
    
    - name: Build APK
      run: |
        echo "Очистка кэша сборки..."
        rm -rf ~/.buildozer
        rm -rf /home/runner/work/weather-app/weather-app/.buildozer/android/platform/build-*
        rm -rf /home/runner/work/weather-app/weather-app/bin
        
        buildozer -v android debug 2>&1 | tee build_output.log || true
        
        if grep -q "Buildozer failed to execute" build_output.log; then
          echo "Сборка завершилась с ошибкой. Лог сохранен."
          exit 1
        fi
    
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: weather-app-apk
        path: bin/*.apk
        retention-days: 7

    - name: Upload Full Error Log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-full-error-log
        path: build_output.log
        retention-days: 7
