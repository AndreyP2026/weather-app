name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip build-essential git python3 python3-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev zlib1g-dev autoconf libtool pkg-config libffi-dev \
          unzip wget cmake ninja-build patch
    
    - name: Install Python dependencies
      run: |
        # КРИТИЧЕСКИ ВАЖНО: Фиксируем стабильную версию pip, чтобы избежать ошибки open_rich_spinner
        python -m pip install --upgrade pip==23.3.2 setuptools==69.5.1 wheel==0.43.0 packaging==24.0
        python -m pip install cython==0.29.33 buildozer
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Погода Приморья
        package.name = pogodaprimorye
        package.domain = org.weather
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,txt
        version = 1.0.0
        
        # ЗОЛОТОЙ СТАНДАРТ: Python 3.10.14 + Kivy 2.2.1
        # Для 3.10.14 все патчи (включая grpmodule.c) применяются идеально.
        # Kivy 2.2.1 не использует libthorvg, избегая ошибки IndexError.
        requirements = python3==3.10.14,kivy==2.2.1,requests
        
        android.permissions = INTERNET,ACCESS_NETWORK_STATE
        android.api = 33
        android.minapi = 21
        
        # NDK 25b - самая стабильная и проверенная версия для этой связки
        android.ndk = 25b
        android.accept_sdk_license = True
        
        orientation = portrait
        fullscreen = 0
        log_level = 2
        p4a.branch = master
        EOF
    
    - name: Build APK
      run: |
        echo "КРИТИЧЕСКИ ВАЖНО: Полная очистка кэша для удаления следов всех предыдущих неудачных сборок..."
        rm -rf ~/.buildozer
        rm -rf .buildozer
        rm -rf bin
        
        buildozer -v android debug 2>&1 | tee build_output.log || true
        
        if grep -q "Buildozer failed to execute" build_output.log; then
          echo "Сборка завершилась с ошибкой. Лог сохранен."
          exit 1
        fi
    
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: weather-app-apk
        path: bin/*.apk
        retention-days: 7

    - name: Upload Full Error Log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-full-error-log
        path: build_output.log
        retention-days: 7
