name: Build APK

on:
  workflow_dispatch: # Позволяет запускать сборку вручную
  push:
    branches: [ main ] # Автоматический запуск при пуше в ветку main

jobs:
  build:
    # ВАЖНО: Используем ubuntu-22.04, а не ubuntu-latest (который сейчас 24.04)
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        # Минимальный набор зависимостей. Убраны gstreamer и лишние медиа-библиотеки, 
        # которые вызывали конфликты (exit code 100). Для Kivy этого достаточно.
        sudo apt-get install -y \
          python3-pip build-essential git python3 python3-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev zlib1g-dev autoconf libtool pkg-config libffi-dev \
          unzip wget cmake ninja-build patch
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel packaging
        python -m pip install cython==0.29.33 buildozer
    
    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Погода Приморья
        package.name = pogodaprimorye
        package.domain = org.weather
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,txt
        version = 1.0.0
        # ВАЖНО: python3 без версии! p4a сам подберет совместимую пару hostpython3/python3
        requirements = python3,kivy==2.3.0,requests,pyjnius,android
        android.permissions = INTERNET,ACCESS_NETWORK_STATE
        android.api = 33
        android.minapi = 21
        android.ndk = 25b
        android.accept_sdk_license = True
        orientation = portrait
        fullscreen = 0
        log_level = 2
        p4a.branch = master
        EOF
    
    - name: Build APK
      run: |
        # Полная очистка старых кэшей для предотвращения конфликтов
        rm -rf ~/.buildozer/android/platform/build-*
        
        # Запускаем сборку и перенаправляем весь вывод (включая ошибки) в файл
        # || true предотвращает мгновенный обрыв шага, позволяя нам проверить лог
        buildozer -v android debug 2>&1 | tee build_output.log || true
        
        # Если в логе есть фраза о провале, принудительно завершаем шаг с ошибкой
        if grep -q "Buildozer failed to execute" build_output.log; then
          echo "Сборка завершилась с ошибкой. Лог сохранен в артефакты."
          exit 1
        fi
    
    - name: Upload APK artifact (если сборка успешна)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: weather-app-apk
        path: bin/*.apk
        retention-days: 7

    - name: Upload Full Error Log (если сборка упала)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-full-error-log
        path: build_output.log
        retention-days: 7
