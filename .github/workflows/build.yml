name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build APK using Docker
      run: |
        # Используем официальный Docker-образ для сборки Kivy-приложений
        # Этот образ уже содержит все правильные версии: Python 3.11, NDK 25b, Kivy 2.2.1
        docker run --rm -v ${PWD}:/app -w /app kivy/buildozer:latest \
          buildozer android debug
        
        # Перемещаем APK в папку bin для загрузки
        mkdir -p bin
        cp bin/*.apk bin/ 2>/dev/null || true
    
    - name: Upload APK artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: weather-app-apk
        path: bin/*.apk
        retention-days: 7
