name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3-pip build-essential git python3 python3-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev zlib1g-dev autoconf libtool pkg-config libffi-dev \
          unzip wget cmake ninja-build patch
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel packaging
        python -m pip install cython==0.29.33 buildozer
    
    - name: Pre-clone and patch python-for-android
      run: |
        echo "Предварительное клонирование python-for-android для применения критических патчей..."
        mkdir -p /home/runner/work/weather-app/weather-app/.buildozer/android/platform
        cd /home/runner/work/weather-app/weather-app/.buildozer/android/platform
        
        # Клонируем актуальную ветку master (в ней есть все свежие исправления для Python 3.11)
        git clone -b master --single-branch https://github.com/kivy/python-for-android.git
        
        # Хирургический патч: отключаем сломанный рецепт libthorvg.
        # Поскольку мы используем Kivy 2.2.1, эта библиотека нам НЕ НУЖНА.
        # Мы просто заменяем тело метода build_arch на 'pass', чтобы избежать IndexError.
        RECIPE_FILE="python-for-android/pythonforandroid/recipes/libthorvg/__init__.py"
        if [ -f "$RECIPE_FILE" ]; then
            echo "Применение патча к рецепту libthorvg..."
            python3 << 'EOF'
import re
with open("python-for-android/pythonforandroid/recipes/libthorvg/__init__.py", "r") as f:
    content = f.read()

# Находим метод build_arch и заменяем его содержимое на 'pass'
pattern = r'(    def build_arch\(self, arch\):)(.*?)(\n    def |\nclass |\Z)'
def replacer(match):
    return match.group(1) + '\n        pass  # PATCHED: libthorvg not needed for Kivy 2.2.1\n' + match.group(3)

content = re.sub(pattern, replacer, content, flags=re.DOTALL)

with open("python-for-android/pythonforandroid/recipes/libthorvg/__init__.py", "w") as f:
    f.write(content)
print("Патч успешно применен.")
EOF
        else
            echo "Рецепт libthorvg не найден, патч не требуется."
        fi

    - name: Create buildozer.spec
      run: |
        cat > buildozer.spec << 'EOF'
        [app]
        title = Погода Приморья
        package.name = pogodaprimorye
        package.domain = org.weather
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,txt
        version = 1.0.0
        
        # Стабильная связка, которая НЕ требует libthorvg
        requirements = python3,kivy==2.2.1,requests
        
        android.permissions = INTERNET,ACCESS_NETWORK_STATE
        android.api = 33
        android.minapi = 21
        
        # NDK 25b - золотой стандарт совместимости для этой конфигурации
        android.ndk = 25b
        android.accept_sdk_license = True
        
        orientation = portrait
        fullscreen = 0
        log_level = 2
        
        # Указываем master, но Buildozer ПРОПУСТИТ клонирование, 
        # так как мы уже предварительно создали эту папку с нашим патчем!
        p4a.branch = master
        EOF
    
    - name: Build APK
      run: |
        echo "КРИТИЧЕСКИ ВАЖНО: Очистка кэша сборки, но СОХРАНЕНИЕ пропатченной папки python-for-android..."
        rm -rf ~/.buildozer
        # Удаляем только артефакты сборки, но НЕ трогаем папку python-for-android с нашим патчем!
        rm -rf /home/runner/work/weather-app/weather-app/.buildozer/android/platform/build-*
        rm -rf /home/runner/work/weather-app/weather-app/bin
        
        buildozer -v android debug 2>&1 | tee build_output.log || true
        
        if grep -q "Buildozer failed to execute" build_output.log; then
          echo "Сборка завершилась с ошибкой. Лог сохранен."
          exit 1
        fi
    
    - name: Upload APK artifact (если успешно)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: weather-app-apk
        path: bin/*.apk
        retention-days: 7

    - name: Upload Full Error Log (если упало)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-full-error-log
        path: build_output.log
        retention-days: 7
